<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container quiz-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 m-0">Quick Quiz</h1>
            <button id="themeBtn" class="btn btn-outline-secondary btn-sm">Dark Mode</button>
        </div>

        <div id="startScreen" class="quiz-box text-center">
            <h2 class="h4">Ready to test your web skills?</h2>
            <p>You will answer 5 random questions. You have 15 seconds for each question.</p>
            <button id="startBtn" class="btn btn-success">Start Quiz</button>
        </div>

        <div id="quizScreen" class="d-none">
            <div id="progressBar" class="progress-pieces mb-3"></div>
            <div class="quiz-box">
                <div class="d-flex justify-content-between mb-3">
                    <span id="questionCount">Question 1 / 5</span>
                    <span id="timer">Time Left: 15s</span>
                </div>
                <h2 id="questionText" class="h5 mb-4"></h2>
                <div id="options"></div>
                <p id="feedback" class="mt-3 mb-0" aria-live="polite"></p>
                <div class="text-center mt-4">
                    <button id="nextBtn" class="btn btn-success" disabled>Next Question →</button>
                </div>
            </div>
        </div>

        <div id="resultScreen" class="quiz-box text-center d-none">
            <h2 class="h4">Quiz Completed!</h2>
            <p id="scoreText" class="fs-4"></p>
            <p id="resultMessage"></p>
            <button id="downloadBtn" class="btn btn-primary mb-2">Download PDF Result</button>
            <button id="restartBtn" class="btn btn-outline-secondary mb-2">Try Again</button>
        </div>
        <footer class="text-center small footer-text mt-3">
            <div>Muhammad Aryyan Amin</div>
            <div>FA24-BSE-064</div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
